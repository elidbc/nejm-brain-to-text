experiment:
  name: "exp3_final_push"
  seed: 42
  output_dir: trained_models/exp2  # directory to save the trained model and logs
  num_training_batches: 40000  # number of training batches to run
  gpu_number: "0"
  use_amp: True  # whether to use automatic mixed precision (AMP) for training
  
  # Pretrained model settings
  # Set pretrained_ckpt_path to load baseline RNN weights for GRU and classifier
  # Set freeze_gru to True to only train day_adapter weights
  resuming: True
  pretrained_ckpt_path: "../data/t15_pretrained_rnn_baseline/checkpoint/best_checkpoint"
  ckpt_type: "exp2"  # "pretrained" for baseline RNN checkpoint, "exp" for exp2 checkpoint
  mlp_ckpt_path: "trained_models/exp2/checkpoint_best_phase3_pt11.pt"
  
  freeze_gru: False
  
  # Gradient accumulation settings for training on smaller GPUs
  # Effective batch size = target_batch_size, achieved by accumulating gradients
  # over (target_batch_size / cuda_batch_size) mini-batches
  target_batch_size: 64  # effective batch size after gradient accumulation
  cuda_batch_size: 64  # batch size that fits in GPU memory (should match dataset.batch_size)


model:
  lr_min: 0.0000
  lr_max_day: 0.0005  # learning rate for day adapter weights
  lr_max_gru: 0.00001  # learning rate for GRU weights (lower than adapters for fine-tuning)
  
  # Day-specific adapter: projects neural features to common latent space
  # Output dim MUST be 512 to match baseline day layer output
  adapter:
    neural_dim: 512   # input dimensionality of neural data
    hidden_dim: 512   # hidden layer size in adapter MLP
    dropout_rate: 0.2
    output_dim: 512   # MUST match baseline (512) for GRU input compatibility

  # GRU decoder: MUST match baseline pretrained model architecture
  # Baseline: 768 hidden, 5 layers, unidirectional, dropout 0.4
  gru_decoder:
    hidden_dim: 768        # MUST match baseline
    num_layers: 5          # MUST match baseline
    dropout_rate: 0.4      # MUST match baseline
    bidirectional: False   # MUST match baseline (unidirectional)

  num_classes: 41          # number of phoneme classes
  neural_dim: 512          # dimensionality of neural data
  
  # Patching: MUST match baseline (patch_size=14, patch_stride=4)
  # GRU input dim = adapter.output_dim * patch_size = 512 * 14 = 7168
  patch_size: 14           # MUST match baseline
  patch_stride: 4          # MUST match baseline


dataset:
  data_transforms:
    white_noise_std: 1.0       # standard deviation of white noise added to data
    constant_offset_std: 0.2   # standard deviation of constant offset added to data
    random_walk_std: 0.0       # standard deviation of random walk added to data
    random_walk_axis: -1       # axis along which random walk is applied
    static_gain_std: 0.0       # standard deviation of static gain applied to data
    random_cut: 3              # number of time steps to randomly cut from beginning
    smooth_kernel_size: 100    # size of smoothing kernel applied to data
    smooth_data: true          # whether to smooth the data
    smooth_kernel_std: 2       # standard deviation of smoothing kernel

  neural_dim: 512              # dimensionality of neural data
  batch_size: 64               # batch size for training (must match cuda_batch_size)
  n_classes: 41                # number of classes (phonemes) in the dataset
  max_seq_elements: 500        # maximum number of sequence elements (phonemes) for any trial
  days_per_batch: 16            # number of randomly-selected days to include in each batch
  seed: 1                      # random seed for reproducibility
  num_dataloader_workers: 4    # number of workers for the data loader
  loader_shuffle: false        # whether to shuffle the data loader
  must_include_days: null      # specific days to include in the dataset
  test_percentage: 0.1         # percentage of data to use for testing
  feature_subset: null         # specific features to include in the dataset
  n_sessions: 45               # number of sessions in the dataset

  dataset_dir: ../data/hdf5_data_final  # directory containing the dataset
  bad_trials_dict: null        # dictionary of bad trials to exclude from the dataset
  
